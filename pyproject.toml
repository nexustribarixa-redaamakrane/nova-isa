[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-isa"
version = "1.1.0"
description = "Nova ISA v1.0 specification, reference implementation, and toolchain"
requires-python = ">=3.11"

[project.scripts]
nova-cc = "nova.cli:compile_main"
nova-as = "nova.cli:assemble_main"
nova-ld = "nova.cli:link_main"
nova-objdump = "nova.cli:objdump_main"
nova-run = "nova.cli:run_main"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.setuptools.package-data]
nova = [
    "runtime/include/*.h",
    "runtime/src/*.c",
    "runtime/*.s",
    "npk/src/*.c",
    "npk/src/*.s",
]

[tool.pytest.ini_options]
pythonpath = ["."]